project:
  title: "HybridMind evidence-to-answer under a fixed budget"
  question: >
    At a fixed evidence-token and inference budget, which changes recover missing
    evidence, preserve all evidence needed for multi-hop answers, and turn that
    evidence into correct, supported answers?
  status: active
  started: "2026-09-25"
  domain: "long-term conversational memory retrieval + RAG evaluation"
constraints:
